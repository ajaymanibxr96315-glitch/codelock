<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960">
<defs>
  <marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
  </marker>
  <marker id="headred" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/>
  </marker>
  <style>
    .t { font: 13px Segoe UI, Arial, sans-serif; fill: #1f2937; }
    .bt { font: 700 15px Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .bs { font: 12.5px Segoe UI, Arial, sans-serif; fill: #334155; }
    .layer { font: 700 11px Segoe UI, Arial, sans-serif; fill: #64748b; letter-spacing: 1.6px; }
    .edge { font: 600 11px Segoe UI, Arial, sans-serif; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; }
    .box { fill: #ffffff; stroke: #475569; stroke-width: 1.6; }
    .gui { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.7; }
    .svc { fill: #f8fafc; stroke: #334155; stroke-width: 1.6; }
    .exam { fill: #ecfdf5; stroke: #047857; stroke-width: 1.6; }
    .lock { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.6; }
    .data { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.6; }
    .ai { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .note { font: 11.5px Segoe UI, Arial, sans-serif; fill: #64748b; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.9; marker-end: url(#head); }
    .dash { fill: none; stroke: #6d28d9; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#head); }
    .arrow-red { fill: none; stroke: #b91c1c; stroke-width: 1.9; marker-end: url(#headred); }
  </style>
</defs>
<rect width="1200" height="960" fill="#ffffff"/>
<rect x="470" y="26" width="260" height="66" rx="10" class="gui"/>
<text x="485" y="54" class="bt">Student signs in</text>
<text x="485" y="79" class="bs">username + password</text><rect x="430" y="132" width="340" height="68" rx="10" class="box"/>
<text x="445" y="160" class="bt">Choose how to study</text>
<text x="445" y="185" class="bs">two-button mode chooser</text><path d="M600,92 L600,132" class="arrow"/><path d="M430,166 L330,166 L330,248" class="arrow"/><text x="300" y="158" class="edge">1. Exam Preparation</text><path d="M770,166 L870,166 L870,248" class="arrow"/><text x="782" y="158" class="edge">2. DSA Practice</text><rect x="90" y="248" width="400" height="74" rx="10" class="exam"/>
<text x="105" y="276" class="bt">Exam Preparation</text>
<text x="105" y="301" class="bs">PC remains unlocked</text><rect x="90" y="358" width="400" height="74" rx="10" class="exam"/>
<text x="105" y="386" class="bt">Create workspace</text>
<text x="105" y="411" class="bs">upload PDF / DOCX / TXT · review and approve topics</text><rect x="90" y="468" width="400" height="74" rx="10" class="exam"/>
<text x="105" y="496" class="bt">Study tools</text>
<text x="105" y="521" class="bs">revision notes · question bank · practice · mock</text><rect x="90" y="578" width="400" height="66" rx="10" class="box"/>
<text x="105" y="606" class="bt">Close the exam window</text>
<text x="105" y="631" class="bs">CodeLock exits; no lock was applied</text><path d="M290,322 L290,358" class="arrow"/><path d="M290,432 L290,468" class="arrow"/><path d="M290,542 L290,578" class="arrow"/><rect x="710" y="248" width="400" height="74" rx="10" class="lock"/>
<text x="725" y="276" class="bt">DSA Practice</text>
<text x="725" y="301" class="bs">Engineering track starts immediately + PC lock</text><rect x="710" y="358" width="400" height="74" rx="10" class="lock"/>
<text x="725" y="386" class="bt">Write a solution</text>
<text x="725" y="411" class="bs">editor blocks paste; submit when ready</text><rect x="710" y="468" width="400" height="74" rx="10" class="lock"/>
<text x="725" y="496" class="bt">Judge the submission</text>
<text x="725" y="521" class="bs">hidden tests · strict protocol · 3 s timeout</text><path d="M910,322 L910,358" class="arrow"/><path d="M910,432 L910,468" class="arrow"/><path d="M910,542 L910,578" class="arrow"/><path d="M910,578 L1005,628 L910,678 L815,628 Z" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/><text x="866" y="633" class="bt">All tests pass?</text><path d="M910,678 L910,718" class="arrow"/><text x="920" y="704" class="edge">yes</text><rect x="710" y="718" width="400" height="66" rx="10" class="data"/>
<text x="725" y="746" class="bt">Unlock reward</text>
<text x="725" y="771" class="bs">student confirms · 15-minute countdown</text><rect x="710" y="818" width="400" height="66" rx="10" class="lock"/>
<text x="725" y="846" class="bt">Auto-relock</text>
<text x="725" y="871" class="bs">timer expires · next challenge · block returns</text><path d="M910,784 L910,818" class="arrow"/><path d="M815,628 L640,628 L640,395 L710,395" class="arrow-red"/><text x="646" y="612" class="edge">retry</text><text x="40" y="936" class="note">The final check exercised this flow in --dry-run. No real hosts-file write, UAC approval or helper installation was performed.</text></svg>