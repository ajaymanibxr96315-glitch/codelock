<text x="1020" y="670" class="bs">same logical schema</text><path d="M40,170 L26,170 L26,635 L40,635" class="arrow"/><text x="22" y="470" class="edge" transform="rotate(-90 22 470)">lock / unlock</text><path d="M305,635 L335,635" class="arrow"/><path d="M1000,354 L1000,400 L887,400 L887,580" class="arrow"/><path d="M1085,354 L1085,580" class="dash"/><text x="40" y="736" class="note">The hosts helper is installed separately by an administrator. The GUI never installs or elevates itself;</text><text x="40" y="756" class="note">if the helper is unavailable, website blocking reports an honest unavailable status and the rest of the app still starts.</text></svg>