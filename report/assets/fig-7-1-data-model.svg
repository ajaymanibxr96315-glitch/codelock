<text x="40" y="40" class="bt">Logical schema shared by SQLite (default) and Oracle (optional)</text><text x="40" y="62" class="note">Primary keys identify rows; foreign keys carry student ownership into every dependent table.</text><text x="40" y="82" class="note">student_id is also stored on sessions, questions and responses so reads can enforce ownership.</text><rect x="40" y="350" width="250" height="190" rx="8" class="data"/><rect x="40" y="350" width="250" height="34" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.4"/><text x="52" y="373" class="bt">students</text><text x="52" y="408" class="bs">id  (PK)</text><text x="52" y="429" class="bs">username  (unique)</text><text x="52" y="450" class="bs">display_name</text><text x="52" y="471" class="bs">password_hash, salt</text><text x="52" y="492" class="bs">created_at, last_login</text><rect x="350" y="130" width="270" height="175" rx="8" class="data"/><rect x="350" y="130" width="270" height="34" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.4"/><text x="362" y="153" class="bt">progress</text><text x="362" y="188" class="bs">student_id  (PK, FK)</text><text x="362" y="209" class="bs">track_key  (PK)</text><text x="362" y="230" class="bs">current_index, completed</text><text x="362" y="251" class="bs">attempts, total_seconds</text><text x="362" y="272" class="bs">best_seconds, updated_at</text><rect x="350" y="360" width="270" height="185" rx="8" class="data"/><rect x="350" y="360" width="270" height="34" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.4"/><text x="362" y="383" class="bt">attempts</text><text x="362" y="418" class="bs">id  (PK)</text><text x="362" y="439" class="bs">student_id  (FK)</text><text x="362" y="460" class="bs">track_key, problem_key</text><text x="362" y="481" class="bs">duration_seconds, passed</text><text x="362" y="502" class="bs">tests_passed / tests_total</text><text x="362" y="523" class="bs">created_at</text><rect x="350" y="600" width="270" height="210" rx="8" class="exam"/><rect x="350" y="600" width="270" height="34" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.4"/><text x="362" y="623" class="bt">exam_workspaces</text><text x="362" y="658" class="bs">workspace_id  (PK)</text><text x="362" y="679" class="bs">student_id  (FK)</text><text x="362" y="700" class="bs">subject, course_level, exam_date</text><text x="362" y="721" class="bs">source_text, topics_json</text><text x="362" y="742" class="bs">syllabus_approved, notes_json</text><text x="362" y="763" class="bs">questions_json, fingerprint</text><rect x="690" y="130" width="290" height="200" rx="8" class="exam"/><rect x="690" y="130" width="290" height="34" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.4"/><text x="702" y="153" class="bt">exam_sessions</text><text x="702" y="188" class="bs">session_id  (PK)</text><text x="702" y="209" class="bs">student_id  (FK)</text><text x="702" y="230" class="bs">workspace_id  (FK)</text><text x="702" y="251" class="bs">mode, status, blueprint_json</text><text x="702" y="272" class="bs">total_marks, score_marks</text><text x="702" y="293" class="bs">needs_review, duration_limit</text><rect x="690" y="370" width="290" height="195" rx="8" class="exam"/><rect x="690" y="370" width="290" height="34" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.4"/><text x="702" y="393" class="bt">exam_questions</text><text x="702" y="428" class="bs">question_id  (PK)</text><text x="702" y="449" class="bs">workspace_id  (FK)</text><text x="702" y="470" class="bs">student_id, unit_title, topic</text><text x="702" y="491" class="bs">type, difficulty, bloom_level</text><text x="702" y="512" class="bs">prompt, options_json, answer</text><text x="702" y="533" class="bs">source_quote, is_active</text><rect x="690" y="610" width="290" height="195" rx="8" class="exam"/><rect x="690" y="610" width="290" height="34" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.4"/><text x="702" y="633" class="bt">exam_responses</text><text x="702" y="668" class="bs">response_id  (PK)</text><text x="702" y="689" class="bs">session_id  (FK)</text><text x="702" y="710" class="bs">question_id  (FK)</text><text x="702" y="731" class="bs">student_answer, is_correct</text><text x="702" y="752" class="bs">awarded_marks, review_status</text><text x="702" y="773" class="bs">question_snapshot_json</text><path d="M290,380 L320,380 L320,210 L350,210" class="arrow"/><text x="300" y="296" class="edge">1:N</text><path d="M290,445 L350,445" class="arrow"/><text x="304" y="437" class="edge">1:N</text><path d="M290,500 L320,500 L320,700 L350,700" class="arrow"/><text x="300" y="540" class="edge">1:N</text><path d="M835,330 L835,370" class="arrow"/><text x="843" y="358" class="edge">1:N</text><path d="M620,700 L655,700 L655,200 L690,200" class="dash"/><text x="598" y="470" class="edge">blueprint</text><path d="M835,610 L835,565" class="dash"/><text x="843" y="595" class="edge">snapshot</text><path d="M620,740 L670,740 L670,690 L690,690" class="arrow"/><text x="628" y="730" class="edge">sync</text><text x="40" y="848" class="note">PK  primary key   ·   FK  foreign key   ·   dashed  =   derived or snapshot relationship</text></svg>