  <style>
    .t { font: 13px Segoe UI, Arial, sans-serif; fill: #1f2937; }
    .bt { font: 700 15px Segoe UI, Arial, sans-serif; fill: #0f172a; }
    .bs { font: 12.5px Segoe UI, Arial, sans-serif; fill: #334155; }
